name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  CI: 'true'

jobs:
  verify:
    name: Check application
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Static checks
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build application
        run: npm run build

  desktop:
    name: Build Windows desktop
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Install application dependencies
        run: npm ci
      - name: Install desktop dependencies
        run: npm --prefix desktop ci
      - name: Install and verify locked Electron runtime
        shell: pwsh
        run: |
          node --version
          npm --version
          node desktop/node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw 'Locked Electron runtime installation failed.' }
          node -e 'const fs=require("node:fs"),path=require("node:path");const base=path.resolve("desktop/node_modules/electron");const manifest=require(path.join(base,"package.json"));const version=fs.readFileSync(path.join(base,"dist/version"),"utf8").trim().replace(/^v/,"");const executable=fs.readFileSync(path.join(base,"path.txt"),"utf8").trim();if(version!==manifest.version||executable!=="electron.exe")throw new Error("Electron runtime version/platform mismatch");const directory=fs.realpathSync.native(path.join(base,"dist"));const binary=fs.realpathSync.native(path.join(directory,executable));if(!binary.toLowerCase().startsWith((directory+path.sep).toLowerCase())||!fs.statSync(binary).isFile())throw new Error("Electron runtime executable is invalid");console.log(JSON.stringify({electronVersion:version,platform:process.platform,arch:process.arch,runtimeVerified:true}));'
          if ($LASTEXITCODE -ne 0) { throw 'Locked Electron runtime verification failed.' }
      - name: Desktop tests
        run: npm run desktop:test
      - name: Package Windows application
        run: npm run desktop:package
      - name: Smoke test bundled service and persistence
        run: npm run desktop:smoke
      - name: Verify customer, accounting and permission HTTP flows
        run: npm run desktop:operations-smoke
      - name: Verify synchronization HTTP flows
        run: npm run desktop:sync-smoke
      - name: Verify real web and PWA acceptance flows
        shell: pwsh
        timeout-minutes: 5
        run: |
          $workspaceUiLogDirectory = Join-Path $env:RUNNER_TEMP ('subscription-butler-workspace-ui-' + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $workspaceUiLogDirectory -Force | Out-Null
          $workspaceUiStdout = Join-Path $workspaceUiLogDirectory 'stdout.log'
          $workspaceUiStderr = Join-Path $workspaceUiLogDirectory 'stderr.log'
          $workspaceUiResultPath = $null
          try {
            $workspaceUiExecutable = Join-Path $env:GITHUB_WORKSPACE 'desktop/node_modules/electron/dist/electron.exe'
            $workspaceUiProcess = Start-Process -FilePath $workspaceUiExecutable -ArgumentList 'scripts/smoke-workspace-ui.cjs' -WorkingDirectory $env:GITHUB_WORKSPACE -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput $workspaceUiStdout -RedirectStandardError $workspaceUiStderr
            $workspaceUiLastJson = Get-Content -LiteralPath $workspaceUiStdout | Where-Object { $_ -match '^\s*\{.*\}\s*$' } | Select-Object -Last 1
            if (-not $workspaceUiLastJson) { throw 'Web/PWA acceptance did not produce a JSON result reference.' }
            $workspaceUiReference = $workspaceUiLastJson | ConvertFrom-Json
            if ([string]::IsNullOrWhiteSpace($workspaceUiReference.resultFile)) { throw 'Web/PWA acceptance did not report a result file.' }
            $workspaceUiResultPath = $workspaceUiReference.resultFile
            if (-not (Test-Path -LiteralPath $workspaceUiResultPath -PathType Leaf)) { throw 'Web/PWA acceptance result file is missing.' }
            $workspaceUiResult = Get-Content -LiteralPath $workspaceUiResultPath -Raw | ConvertFrom-Json
            if ($workspaceUiReference.status -ne 'ok' -or $workspaceUiResult.status -ne 'ok' -or @($workspaceUiResult.checks).Count -ne 4) { throw 'Web/PWA acceptance did not pass all four checks.' }
            Write-Output "Web/PWA acceptance passed all four checks (Electron exit code $($workspaceUiProcess.ExitCode))."
          } catch {
            foreach ($workspaceUiLog in @($workspaceUiStdout, $workspaceUiStderr)) {
              if (Test-Path -LiteralPath $workspaceUiLog -PathType Leaf) {
                Write-Output "Acceptance log: $workspaceUiLog"
                Get-Content -LiteralPath $workspaceUiLog | Write-Output
              }
            }
            if ($workspaceUiResultPath -and (Test-Path -LiteralPath $workspaceUiResultPath -PathType Leaf)) { Get-Content -LiteralPath $workspaceUiResultPath -Raw | Write-Output }
            if ($workspaceUiResultPath) {
              $workspaceUiDiagnosticPath = Join-Path (Split-Path -Parent $workspaceUiResultPath) 'diagnostic.json'
              if (Test-Path -LiteralPath $workspaceUiDiagnosticPath -PathType Leaf) {
                Write-Output "Acceptance diagnostic: $workspaceUiDiagnosticPath"
                Get-Content -LiteralPath $workspaceUiDiagnosticPath -Raw | Write-Output
              }
            }
            throw
          }
      - name: Smoke test packaged application
        shell: pwsh
        timeout-minutes: 5
        run: |
          $version = (Get-Content -LiteralPath desktop/package.json -Raw | ConvertFrom-Json).version
          $executablePath = Join-Path $env:GITHUB_WORKSPACE "desktop/dist/SubscriptionButler-$version-Windows-x64.exe"
          if (-not (Test-Path -LiteralPath $executablePath -PathType Leaf)) {
            throw 'Packaged executable was not produced.'
          }
          $smokeDirectory = Join-Path $env:RUNNER_TEMP ('subscription-butler-package-smoke-' + [guid]::NewGuid())
          $env:SUBSCRIPTION_BUTLER_USER_DATA = $smokeDirectory
          $smokeProcess = Start-Process -FilePath $executablePath -ArgumentList '--maintenance-smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($smokeProcess.ExitCode -ne 0) { throw 'Packaged application smoke test failed.' }
          $resultPath = Join-Path $smokeDirectory 'smoke-result.json'
          if (-not (Test-Path -LiteralPath $resultPath -PathType Leaf)) { throw 'Smoke result was not produced.' }
          $smokeResult = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if ($smokeResult.status -ne 'ok' -or $smokeResult.health -ne 'ok' -or $smokeResult.loginStatus -ne 200 -or $smokeResult.version -ne $version) {
            throw 'Packaged application did not pass health, login and version checks.'
          }
          if (-not $smokeResult.maintenance.encryptedBackup -or -not $smokeResult.maintenance.restored -or -not $smokeResult.maintenance.rollback) { throw 'Packaged encrypted backup and restore checks failed.' }
          Write-Output "Packaged application smoke test passed for version $version."
      - name: Verify no-key first open, forms and restart in real desktop
        shell: pwsh
        timeout-minutes: 5
        run: |
          $uiVersion = (Get-Content -LiteralPath desktop/package.json -Raw | ConvertFrom-Json).version
          $uiExecutable = Join-Path $env:GITHUB_WORKSPACE 'desktop/dist/win-unpacked/订阅管家.exe'
          $uiDirectory = Join-Path $env:RUNNER_TEMP ('subscription-butler-ui-smoke-' + [guid]::NewGuid())
          $env:SUBSCRIPTION_BUTLER_USER_DATA = $uiDirectory
          $uiProcess = Start-Process -FilePath $uiExecutable -ArgumentList '--ui-smoke-test' -WindowStyle Hidden -Wait -PassThru
          if ($uiProcess.ExitCode -ne 0) { throw 'Real desktop UI flow failed.' }
          $uiResult = Get-Content -LiteralPath (Join-Path $uiDirectory 'ui-smoke-result.json') -Raw | ConvertFrom-Json
          if ($uiResult.status -ne 'ok' -or $uiResult.visibleWindow -or $uiResult.consoleErrors.Count -ne 0) { throw 'No-key desktop UI checks failed.' }
          foreach ($uiRequiredStep in @('classic-calendar-startup-and-sidebar', 'embedded-customer-page', 'renewal-calendar-all-accounts-and-risk-list', 'calendar-renewal-button-history-colors-and-idempotency')) {
            if ($uiResult.steps -notcontains $uiRequiredStep) { throw "Required classic desktop UI check missing: $uiRequiredStep" }
          }
          if ($uiResult.steps -notcontains 'backend-window-restart-owner-auto-entry-data-persistence') { throw 'Owner auto-entry or persistence check missing.' }
      - name: Save build for inspection
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: subscription-butler-windows-x64
          path: |
            desktop/dist/SubscriptionButler-*-Windows-x64.exe
            LICENSE
            NOTICE
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
